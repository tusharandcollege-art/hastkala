<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%BA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f79a08" />
    <meta name="description" content="Hastkala — Rural Artisan Supply Chain & Store POS Platform" />
    <title>Hastkala — Rural Artisan Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f9fafb;font-family:system-ui,-apple-system,sans-serif;">' +
            '<div style="background:#fff;border:1px solid #fee2e2;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.08);padding:32px;max-width:520px;width:100%;text-align:center;">' +
            '<div style="font-size:48px;margin-bottom:12px;">🏺</div>' +
            '<h2 style="font-size:20px;font-weight:700;color:#111827;margin-bottom:8px;">Hastkala — System Recovery</h2>' +
            '<p style="font-size:13px;color:#6b7280;margin-bottom:16px;">A browser startup issue was intercepted. Click below to reset stored data and reload:</p>' +
            '<div style="background:#fef2f2;color:#991b1b;padding:12px;border-radius:10px;font-size:12px;font-family:monospace;text-align:left;overflow:auto;max-height:100px;margin-bottom:20px;">' +
            (e.message || (e.error && e.error.message) || 'Startup error') +
            '</div>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="background:#f79a08;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(247,154,8,0.35);">Reset Data & Reload</button>' +
            '</div></div>';
        }
      });
    </script>
  </head>
  <body class="bg-gray-50 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
